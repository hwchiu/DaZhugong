<svg width="300" height="300" viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="vinyl-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#7c2d12" flood-opacity="0.08" />
    </filter>
    <filter id="soft-blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" />
    </filter>
    <radialGradient id="vinyl-white" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="65%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </radialGradient>
    <radialGradient id="vinyl-bear" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ffedd5" />
      <stop offset="60%" stop-color="#fed7aa" />
      <stop offset="100%" stop-color="#ca8a04" />
    </radialGradient>
    <radialGradient id="vinyl-pink-inner" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fecdd3" />
      <stop offset="100%" stop-color="#fda4af" />
    </radialGradient>
    <radialGradient id="blush-gradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fda4af" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#fda4af" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="collar-purple" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d8b4fe" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <radialGradient id="gold-bell" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="60%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#ca8a04" />
    </radialGradient>
    <g id="dot-eye">
      <circle cx="0" cy="0" r="8" fill="#334155" />
      <circle cx="-2.5" cy="-2.5" r="2.5" fill="#ffffff" />
    </g>
  </defs>

  <!-- Background -->
  <rect width="300" height="300" rx="40" fill="#faf6f0" />

  <!-- BEAR MASCOT (Centered at x=150, y=170) -->
  <g transform="translate(150, 170)" filter="url(#vinyl-shadow)">
    <!-- Ears -->
    <circle cx="-54" cy="-54" r="27" fill="url(#vinyl-bear)" stroke="#b45309" stroke-opacity="0.2" stroke-width="1.2" />
    <circle cx="-54" cy="-54" r="16" fill="url(#vinyl-pink-inner)" />

    <circle cx="54" cy="-54" r="27" fill="url(#vinyl-bear)" stroke="#b45309" stroke-opacity="0.2" stroke-width="1.2" />
    <circle cx="54" cy="-54" r="16" fill="url(#vinyl-pink-inner)" />

    <!-- Head Body -->
    <ellipse cx="0" cy="0" rx="80" ry="72" fill="url(#vinyl-bear)" stroke="#b45309" stroke-opacity="0.2" stroke-width="1.5" />

    <!-- White Snout Patch -->
    <ellipse cx="0" cy="22" rx="27" ry="19" fill="url(#vinyl-white)" />

    <!-- Simple dot eyes -->
    <use href="#dot-eye" x="-26" y="4" />
    <use href="#dot-eye" x="26" y="4" />

    <!-- Soft pink blush cheeks -->
    <ellipse cx="-42" cy="18" rx="13" ry="8" fill="url(#blush-gradient)" filter="url(#soft-blur)" />
    <ellipse cx="42" cy="18" rx="13" ry="8" fill="url(#blush-gradient)" filter="url(#soft-blur)" />

    <!-- Nose & Mouth -->
    <ellipse cx="0" cy="14" rx="8" ry="5" fill="#334155" />
    <path d="M 0,18 L 0,25 Q -5,30 -9,26" fill="none" stroke="#475569" stroke-width="3.6" stroke-linecap="round" />
    <path d="M 0,25 Q 5,30 9,26" fill="none" stroke="#475569" stroke-width="3.6" stroke-linecap="round" />

    <!-- Collar -->
    <path d="M -40,62 Q 0,84 40,62 L 35,78 Q 0,100 -35,78 Z" fill="url(#collar-purple)" />
    <!-- Bell -->
    <circle cx="0" cy="90" r="11" fill="url(#gold-bell)" />
    <circle cx="0" cy="93" r="2" fill="#854d0e" />
  </g>
</svg>
