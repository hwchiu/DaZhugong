<svg width="300" height="300" viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="vinyl-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#7c2d12" flood-opacity="0.08" />
    </filter>
    <filter id="soft-blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" />
    </filter>
    <radialGradient id="vinyl-frog" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#bef264" />
      <stop offset="60%" stop-color="#a3e635" />
      <stop offset="100%" stop-color="#84cc16" />
    </radialGradient>
    <radialGradient id="blush-gradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fda4af" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#fda4af" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="collar-green" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bef264" />
      <stop offset="100%" stop-color="#65a30d" />
    </linearGradient>
    <radialGradient id="gold-bell" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="60%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#ca8a04" />
    </radialGradient>
    <g id="dot-eye">
      <circle cx="0" cy="0" r="8" fill="#334155" />
      <circle cx="-2.5" cy="-2.5" r="2.5" fill="#ffffff" />
    </g>
  </defs>

  <!-- Background -->
  <rect width="300" height="300" rx="40" fill="#faf6f0" />

  <!-- FROG MASCOT (Centered at x=150, y=170) -->
  <g transform="translate(150, 170)" filter="url(#vinyl-shadow)">
    <!-- Eye bulges -->
    <circle cx="-40" cy="-48" r="30" fill="url(#vinyl-frog)" stroke="#a3e635" stroke-opacity="0.3" stroke-width="1.2" />
    <circle cx="40" cy="-48" r="30" fill="url(#vinyl-frog)" stroke="#a3e635" stroke-opacity="0.3" stroke-width="1.2" />

    <!-- Head Body -->
    <ellipse cx="0" cy="0" rx="86" ry="64" fill="url(#vinyl-frog)" stroke="#a3e635" stroke-opacity="0.3" stroke-width="1.5" />

    <!-- Simple dot eyes -->
    <use href="#dot-eye" x="-37" y="-29" />
    <use href="#dot-eye" x="47" y="-29" />

    <!-- Soft pink blush cheeks -->
    <ellipse cx="-48" cy="10" rx="14" ry="9" fill="url(#blush-gradient)" filter="url(#soft-blur)" />
    <ellipse cx="48" cy="10" rx="14" ry="9" fill="url(#blush-gradient)" filter="url(#soft-blur)" />

    <!-- Frog Smiling Mouth -->
    <path d="M -28,12 Q 0,34 28,12" fill="none" stroke="#3f6212" stroke-width="4" stroke-linecap="round" />

    <!-- Collar -->
    <path d="M -43,55 Q 0,81 43,55 L 38,71 Q 0,97 -38,71 Z" fill="url(#collar-green)" />
    <!-- Bell -->
    <circle cx="0" cy="83" r="11" fill="url(#gold-bell)" />
    <circle cx="0" cy="86" r="2" fill="#854d0e" />
  </g>
</svg>
