<svg width="300" height="300" viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="vinyl-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#7c2d12" flood-opacity="0.08" />
    </filter>
    <filter id="soft-blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" />
    </filter>
    <radialGradient id="vinyl-white" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="65%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </radialGradient>
    <radialGradient id="vinyl-pink-inner" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fecdd3" />
      <stop offset="100%" stop-color="#fda4af" />
    </radialGradient>
    <radialGradient id="blush-gradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fda4af" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#fda4af" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="collar-coral" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fca5a5" />
      <stop offset="100%" stop-color="#ef4444" />
    </linearGradient>
    <radialGradient id="gold-bell" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="60%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#ca8a04" />
    </radialGradient>
    <g id="dot-eye">
      <circle cx="0" cy="0" r="8" fill="#334155" />
      <circle cx="-2.5" cy="-2.5" r="2.5" fill="#ffffff" />
    </g>
  </defs>

  <!-- Background -->
  <rect width="300" height="300" rx="40" fill="#faf6f0" />

  <!-- RABBIT MASCOT (Centered at x=150, y=170) -->
  <g transform="translate(150, 170)" filter="url(#vinyl-shadow)">
    <!-- Ears -->
    <g transform="rotate(-8 -30 -90)">
      <rect x="-18" y="-140" width="36" height="120" rx="18" fill="url(#vinyl-white)" stroke="#cbd5e1" stroke-opacity="0.3" stroke-width="1.2" />
      <rect x="-10" y="-128" width="20" height="96" rx="10" fill="url(#vinyl-pink-inner)" />
    </g>
    <g transform="rotate(8 30 -90)">
      <rect x="-18" y="-140" width="36" height="120" rx="18" fill="url(#vinyl-white)" stroke="#cbd5e1" stroke-opacity="0.3" stroke-width="1.2" />
      <rect x="-10" y="-128" width="20" height="96" rx="10" fill="url(#vinyl-pink-inner)" />
    </g>

    <!-- Head Body -->
    <ellipse cx="0" cy="0" rx="80" ry="72" fill="url(#vinyl-white)" stroke="#cbd5e1" stroke-opacity="0.3" stroke-width="1.5" />

    <!-- Simple dot eyes -->
    <use href="#dot-eye" x="-26" y="4" />
    <use href="#dot-eye" x="26" y="4" />

    <!-- Soft pink blush cheeks -->
    <ellipse cx="-42" cy="18" rx="13" ry="8" fill="url(#blush-gradient)" filter="url(#soft-blur)" />
    <ellipse cx="42" cy="18" rx="13" ry="8" fill="url(#blush-gradient)" filter="url(#soft-blur)" />

    <!-- Rabbit Snout & Mouth -->
    <path d="M -6,18 Q 0,13 6,18" fill="none" stroke="#475569" stroke-width="3.5" stroke-linecap="round" />
    <path d="M 0,16 L 0,22 Q -5,27 -10,25" fill="none" stroke="#475569" stroke-width="3.2" stroke-linecap="round" />
    <path d="M 0,22 Q 5,27 10,25" fill="none" stroke="#475569" stroke-width="3.2" stroke-linecap="round" />
    <polygon points="-4,13 4,13 0,17" fill="#fda4af" />

    <!-- Collar -->
    <path d="M -40,62 Q 0,84 40,62 L 35,78 Q 0,100 -35,78 Z" fill="url(#collar-coral)" />
    <!-- Bell -->
    <circle cx="0" cy="90" r="11" fill="url(#gold-bell)" />
    <circle cx="0" cy="93" r="2" fill="#854d0e" />
  </g>
</svg>
