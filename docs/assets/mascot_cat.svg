<svg width="300" height="300" viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="vinyl-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#7c2d12" flood-opacity="0.08" />
    </filter>
    <filter id="soft-blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" />
    </filter>
    <radialGradient id="vinyl-cat" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#f1f5f9" />
      <stop offset="60%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </radialGradient>
    <radialGradient id="vinyl-pink-inner" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fecdd3" />
      <stop offset="100%" stop-color="#fda4af" />
    </radialGradient>
    <radialGradient id="blush-gradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fda4af" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#fda4af" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="collar-blue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7dd3fc" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <radialGradient id="gold-bell" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="60%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#ca8a04" />
    </radialGradient>
    <g id="dot-eye">
      <circle cx="0" cy="0" r="8" fill="#334155" />
      <circle cx="-2.5" cy="-2.5" r="2.5" fill="#ffffff" />
    </g>
  </defs>

  <!-- Background -->
  <rect width="300" height="300" rx="40" fill="#faf6f0" />

  <!-- CAT MASCOT (Centered at x=150, y=165) -->
  <g transform="translate(150, 165)" filter="url(#vinyl-shadow)">
    <!-- Ears -->
    <polygon points="-68,-32 -76,-104 -20,-68" fill="url(#vinyl-cat)" stroke="#cbd5e1" stroke-opacity="0.3" stroke-width="1.2" />
    <polygon points="-60,-40 -66,-92 -28,-66" fill="url(#vinyl-pink-inner)" />

    <polygon points="68,-32 76,-104 20,-68" fill="url(#vinyl-cat)" stroke="#cbd5e1" stroke-opacity="0.3" stroke-width="1.2" />
    <polygon points="60,-40 66,-92 28,-66" fill="url(#vinyl-pink-inner)" />

    <!-- Head Body -->
    <ellipse cx="0" cy="0" rx="83" ry="68" fill="url(#vinyl-cat)" stroke="#cbd5e1" stroke-opacity="0.3" stroke-width="1.5" />

    <!-- Simple dot eyes -->
    <use href="#dot-eye" x="-27" y="4" />
    <use href="#dot-eye" x="27" y="4" />

    <!-- Soft pink blush cheeks -->
    <ellipse cx="-44" cy="18" rx="13" ry="8" fill="url(#blush-gradient)" filter="url(#soft-blur)" />
    <ellipse cx="44" cy="18" rx="13" ry="8" fill="url(#blush-gradient)" filter="url(#soft-blur)" />

    <!-- Whiskers -->
    <line x1="-64" y1="12" x2="-84" y2="8" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round" />
    <line x1="-64" y1="22" x2="-86" y2="22" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round" />
    <line x1="64" y1="12" x2="84" y2="8" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round" />
    <line x1="64" y1="22" x2="86" y2="22" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round" />

    <!-- Mouth & Nose -->
    <polygon points="-3,14 3,14 0,17.5" fill="#fda4af" />
    <path d="M -10,20 Q -5,25 0,20 Q 5,25 10,20" fill="none" stroke="#475569" stroke-width="3.2" stroke-linecap="round" />

    <!-- Collar -->
    <path d="M -42,58 Q 0,82 42,58 L 37,74 Q 0,98 -37,74 Z" fill="url(#collar-blue)" />
    <!-- Bell -->
    <circle cx="0" cy="86" r="11" fill="url(#gold-bell)" />
    <circle cx="0" cy="89" r="2" fill="#854d0e" />
  </g>
</svg>
