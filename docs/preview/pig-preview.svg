<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="800" height="420">
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stopColor="#fff1f2"/>
      <stop offset="100%" stopColor="#fce7f3"/>
    </linearGradient>
    <!-- Card gradient -->
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stopColor="#ffffff"/>
      <stop offset="100%" stopColor="#fdf2f8"/>
    </linearGradient>
    <!-- Pig body radial -->
    <radialGradient id="pig-body" cx="38%" cy="30%" r="65%">
      <stop offset="0%" stopColor="#fecdd3"/>
      <stop offset="55%" stopColor="#fb7185"/>
      <stop offset="100%" stopColor="#e11d48" stopOpacity="0.9"/>
    </radialGradient>
    <radialGradient id="pig-head" cx="38%" cy="30%" r="65%">
      <stop offset="0%" stopColor="#fecdd3"/>
      <stop offset="60%" stopColor="#fda4af"/>
      <stop offset="100%" stopColor="#fb7185"/>
    </radialGradient>
    <radialGradient id="pig-snout" cx="42%" cy="36%" r="60%">
      <stop offset="0%" stopColor="#fff1f2"/>
      <stop offset="100%" stopColor="#fda4af"/>
    </radialGradient>
    <radialGradient id="pig-cheek" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stopColor="#fda4af" stopOpacity="0.85"/>
      <stop offset="100%" stopColor="#fb7185" stopOpacity="0.3"/>
    </radialGradient>
    <filter id="drop-shadow" x="-15%" y="-15%" width="135%" height="145%">
      <feDropShadow dx="3" dy="6" stdDeviation="6" floodColor="#9f1239" floodOpacity="0.22"/>
    </filter>
    <filter id="card-shadow" x="-5%" y="-5%" width="115%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="12" floodColor="#000" floodOpacity="0.10"/>
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="145%" height="145%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="420" fill="url(#bg)"/>
  <!-- Subtle dot pattern -->
  <circle cx="20" cy="20" r="3" fill="#fda4af" opacity="0.3"/>
  <circle cx="60" cy="50" r="2" fill="#fda4af" opacity="0.2"/>
  <circle cx="100" cy="20" r="3" fill="#fda4af" opacity="0.25"/>
  <circle cx="740" cy="380" r="3" fill="#fda4af" opacity="0.3"/>
  <circle cx="770" cy="350" r="2" fill="#fda4af" opacity="0.2"/>
  <circle cx="710" cy="395" r="2.5" fill="#fda4af" opacity="0.25"/>

  <!-- ── Left info card ─────────────────────────────────────── -->
  <rect x="32" y="36" width="330" height="348" rx="20" fill="url(#card)" filter="url(#card-shadow)" stroke="#fecdd3" strokeWidth="1.5"/>

  <!-- App icon circle -->
  <circle cx="92" cy="108" r="40" fill="#fb7185"/>
  <text x="92" y="120" textAnchor="middle" fontSize="32" fontFamily="'Segoe UI Emoji',sans-serif">🐷</text>

  <!-- Title -->
  <text x="148" y="95" fontFamily="'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif"
        fontSize="28" fontWeight="700" fill="#0f172a" letterSpacing="-0.5">大豬公</text>
  <text x="148" y="123" fontFamily="'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif"
        fontSize="14" fontWeight="500" fill="#64748b">DaZhugong</text>

  <!-- Divider -->
  <line x1="52" y1="148" x2="342" y2="148" stroke="#fecdd3" strokeWidth="1.5"/>

  <!-- Description -->
  <text x="52" y="178" fontFamily="'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif"
        fontSize="15" fill="#334155" letterSpacing="0.3">🍱 午餐違規 Token 記錄 App</text>
  <text x="52" y="204" fontFamily="'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif"
        fontSize="13" fill="#64748b">以 3D 互動小豬撲滿呈現累積 Token</text>
  <text x="52" y="224" fontFamily="'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif"
        fontSize="13" fill="#64748b">Firebase Spark · React · Three.js</text>

  <!-- Feature badges -->
  <rect x="52" y="244" width="92" height="28" rx="14" fill="#fce7f3" stroke="#fda4af" strokeWidth="1"/>
  <text x="98" y="263" textAnchor="middle" fontFamily="sans-serif" fontSize="12" fontWeight="600" fill="#be185d">🐷 3D 小豬</text>

  <rect x="152" y="244" width="92" height="28" rx="14" fill="#eff6ff" stroke="#93c5fd" strokeWidth="1"/>
  <text x="198" y="263" textAnchor="middle" fontFamily="sans-serif" fontSize="12" fontWeight="600" fill="#1d4ed8">🪙 Token</text>

  <rect x="252" y="244" width="92" height="28" rx="14" fill="#f0fdf4" stroke="#86efac" strokeWidth="1"/>
  <text x="298" y="263" textAnchor="middle" fontFamily="sans-serif" fontSize="12" fontWeight="600" fill="#15803d">📊 統計</text>

  <!-- PR change label -->
  <rect x="52" y="290" width="290" height="52" rx="10" fill="#fef9c3" stroke="#fde047" strokeWidth="1.5"/>
  <text x="72" y="312" fontFamily="sans-serif" fontSize="12" fontWeight="700" fill="#713f12">✨ 本次改動</text>
  <text x="72" y="330" fontFamily="sans-serif" fontSize="11" fill="#92400e">3D 小豬品質升級：材質·打光·比例·尾巴·腮紅</text>

  <!-- URL -->
  <text x="52" y="368" fontFamily="monospace" fontSize="11" fill="#94a3b8">dazhugong-4f185.web.app</text>

  <!-- ── 3D Pig illustration ─────────────────────────────────── -->
  <!-- Ground shadow -->
  <ellipse cx="580" cy="368" rx="138" ry="18" fill="#9f1239" opacity="0.12"/>

  <!-- Body -->
  <ellipse cx="565" cy="270" rx="138" ry="100" fill="url(#pig-body)" stroke="#be123c" strokeWidth="2.5" filter="url(#drop-shadow)"/>

  <!-- Head -->
  <circle cx="670" cy="215" r="92" fill="url(#pig-head)" stroke="#be123c" strokeWidth="2.5" filter="url(#drop-shadow)"/>

  <!-- Ear left (outer + inner) -->
  <ellipse cx="634" cy="140" rx="28" ry="40" fill="#fb7185" stroke="#be123c" strokeWidth="2" transform="rotate(-20 634 140)"/>
  <ellipse cx="634" cy="140" rx="16" ry="26" fill="#fecdd3" transform="rotate(-20 634 140)"/>

  <!-- Ear right (outer + inner) -->
  <ellipse cx="716" cy="132" rx="28" ry="40" fill="#fb7185" stroke="#be123c" strokeWidth="2" transform="rotate(20 716 132)"/>
  <ellipse cx="716" cy="132" rx="16" ry="26" fill="#fecdd3" transform="rotate(20 716 132)"/>

  <!-- Snout -->
  <ellipse cx="740" cy="228" rx="46" ry="34" fill="url(#pig-snout)" stroke="#be123c" strokeWidth="2"/>
  <!-- Nostrils -->
  <circle cx="726" cy="226" r="9" fill="#9f1239" fillOpacity="0.65"/>
  <circle cx="752" cy="226" r="9" fill="#9f1239" fillOpacity="0.65"/>

  <!-- Eye -->
  <circle cx="656" cy="196" r="13" fill="#1e293b"/>
  <circle cx="660" cy="191" r="5" fill="white" fillOpacity="0.75"/>

  <!-- Cheek blush -->
  <ellipse cx="641" cy="228" rx="22" ry="14" fill="url(#pig-cheek)"/>

  <!-- Smile -->
  <path d="M720 250 Q733 262 746 250" stroke="#be123c" strokeWidth="2.5" fill="none" strokeLinecap="round"/>

  <!-- Coin slot -->
  <rect x="518" y="168" width="96" height="12" rx="6" fill="#4c0519" fillOpacity="0.8"/>

  <!-- Legs (4) -->
  <rect x="460" y="346" width="38" height="44" rx="16" fill="#fb7185" stroke="#be123c" strokeWidth="2"/>
  <ellipse cx="479" cy="392" rx="20" ry="8" fill="#f43f6e"/>

  <rect x="514" y="350" width="38" height="40" rx="16" fill="#fb7185" stroke="#be123c" strokeWidth="2"/>
  <ellipse cx="533" cy="392" rx="20" ry="8" fill="#f43f6e"/>

  <rect x="572" y="350" width="38" height="40" rx="16" fill="#fb7185" stroke="#be123c" strokeWidth="2"/>
  <ellipse cx="591" cy="392" rx="20" ry="8" fill="#f43f6e"/>

  <rect x="626" y="346" width="38" height="44" rx="16" fill="#fb7185" stroke="#be123c" strokeWidth="2"/>
  <ellipse cx="645" cy="392" rx="20" ry="8" fill="#f43f6e"/>

  <!-- Tail (torus arc) -->
  <path d="M430 248 Q410 220 428 200 Q448 180 430 160" stroke="#fb7185" strokeWidth="9" fill="none" strokeLinecap="round"/>

  <!-- Tokens inside pig (shiny coins) -->
  <!-- Gold coin -->
  <ellipse cx="508" cy="295" rx="22" ry="7" fill="#ca8a04"/>
  <ellipse cx="508" cy="289" rx="22" ry="7" fill="#facc15"/>
  <ellipse cx="508" cy="286" rx="20" ry="5" fill="#fde047"/>

  <!-- Blue coin -->
  <ellipse cx="554" cy="310" rx="20" ry="6" fill="#0369a1"/>
  <ellipse cx="554" cy="305" rx="20" ry="6" fill="#38bdf8"/>
  <ellipse cx="554" cy="302" rx="18" ry="4.5" fill="#7dd3fc"/>

  <!-- Purple coin -->
  <ellipse cx="598" cy="298" rx="20" ry="6" fill="#6d28d9"/>
  <ellipse cx="598" cy="293" rx="20" ry="6" fill="#a78bfa"/>
  <ellipse cx="598" cy="290" rx="18" ry="4.5" fill="#c4b5fd"/>

  <!-- Orange coin -->
  <ellipse cx="642" cy="308" rx="19" ry="6" fill="#c2410c"/>
  <ellipse cx="642" cy="303" rx="19" ry="6" fill="#fb923c"/>
  <ellipse cx="642" cy="300" rx="17" ry="4" fill="#fdba74"/>

  <!-- Token count badge -->
  <rect x="454" y="156" width="136" height="30" rx="15" fill="#0f172a" fillOpacity="0.75"/>
  <text x="522" y="176" textAnchor="middle" fontFamily="sans-serif" fontSize="12" fontWeight="600" fill="white">以 4 個代表呈現</text>
</svg>
