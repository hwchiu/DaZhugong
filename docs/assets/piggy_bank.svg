<svg width="800" height="800" viewBox="0 0 800 800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Filters for soft blur (bokeh, glow, subsurface scattering) -->
    <filter id="bokeh-blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="40" />
    </filter>
    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" />
    </filter>
    <filter id="rim-blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" />
    </filter>
    <filter id="token-blur" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="1.5" />
    </filter>

    <!-- Warm Cafe Window Bokeh Gradients -->
    <linearGradient id="bg-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2d221e" />
      <stop offset="40%" stop-color="#402e2b" />
      <stop offset="100%" stop-color="#1f1614" />
    </linearGradient>
    <radialGradient id="bokeh-warm" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="bokeh-cafe" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f97316" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#f97316" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="bokeh-light" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fed7aa" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#fed7aa" stop-opacity="0" />
    </radialGradient>

    <!-- Translucent Frosted Iridescent Resin (Holographic sky-blue -> lavender -> blush pink) -->
    <linearGradient id="iridescent-resin" x1="0.1" y1="0.1" x2="0.9" y2="0.9">
      <stop offset="0%" stop-color="#e0f2fe" stop-opacity="0.65" /> <!-- Pale sky blue -->
      <stop offset="45%" stop-color="#e0e7ff" stop-opacity="0.55" /> <!-- Pale lavender -->
      <stop offset="75%" stop-color="#fae8ff" stop-opacity="0.6" /> <!-- Soft violet-pink -->
      <stop offset="100%" stop-color="#fce7f3" stop-opacity="0.65" /> <!-- Blush pink -->
    </linearGradient>

    <!-- Internal Soft Glow Gradient -->
    <radialGradient id="inner-glow" cx="45%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="40%" stop-color="#fbcfe8" stop-opacity="0.6" />
      <stop offset="80%" stop-color="#c4b5fd" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>

    <!-- Specular Highlight Gradients -->
    <linearGradient id="specular-top" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="rim-light" x1="1" y1="0.5" x2="0" y2="0.5">
      <stop offset="0%" stop-color="#f472b6" stop-opacity="0.75" />
      <stop offset="30%" stop-color="#f472b6" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#f472b6" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="rim-light-blue" x1="0" y1="0.3" x2="1" y2="0.7">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </linearGradient>

    <!-- Star Token Color Fill Definitions -->
    <radialGradient id="token-coral" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#fca5a5" />
      <stop offset="40%" stop-color="#f87171" />
      <stop offset="100%" stop-color="#ef4444" />
    </radialGradient>
    <radialGradient id="token-blue" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#7dd3fc" />
      <stop offset="40%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </radialGradient>
    <radialGradient id="token-green" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#bef264" />
      <stop offset="40%" stop-color="#a3e635" />
      <stop offset="100%" stop-color="#65a30d" />
    </radialGradient>
    <radialGradient id="token-purple" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#d8b4fe" />
      <stop offset="40%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </radialGradient>
    <radialGradient id="token-orange" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="40%" stop-color="#facc15" />
      <stop offset="100%" stop-color="#eab308" />
    </radialGradient>

    <!-- Star Shape Definition -->
    <g id="star-shape">
      <path d="M 0,-25 L 7.3,-7.4 L 23.7,-7.4 L 10.5,4.7 L 15.5,21.8 L 0,11.5 L -15.5,21.8 L -10.5,4.7 L -23.7,-7.4 L -7.3,-7.4 Z" />
    </g>
  </defs>

  <!-- BACKGROUND: Warm Cafe Window Bokeh -->
  <rect width="800" height="800" fill="url(#bg-grad)" />
  
  <!-- Subtle Cafe Window Lines (Blurred) -->
  <g filter="url(#bokeh-blur)">
    <!-- Vertical and Horizontal window pane glow -->
    <rect x="250" y="0" width="35" height="800" fill="#f59e0b" opacity="0.08" />
    <rect x="0" y="300" width="800" height="35" fill="#f59e0b" opacity="0.08" />
    
    <!-- Bokeh circles -->
    <circle cx="150" cy="180" r="140" fill="url(#bokeh-warm)" />
    <circle cx="680" cy="220" r="110" fill="url(#bokeh-cafe)" />
    <circle cx="280" cy="120" r="80" fill="url(#bokeh-light)" />
    <circle cx="500" cy="150" r="130" fill="url(#bokeh-warm)" />
    <circle cx="100" cy="550" r="90" fill="url(#bokeh-cafe)" />
    <circle cx="700" cy="580" r="120" fill="url(#bokeh-warm)" />
  </g>

  <!-- TABLE SURFACE SHADOW -->
  <ellipse cx="400" cy="650" rx="260" ry="45" fill="#000000" opacity="0.35" filter="url(#soft-glow)" />

  <!-- INTERNAL GLOW (Glowing from within) -->
  <ellipse cx="380" cy="450" rx="190" ry="160" fill="url(#inner-glow)" filter="url(#soft-glow)" />

  <!-- INSIDE THE GLASS: Star-shaped tokens (Rendered inside/behind the front glass layer) -->
  <g filter="url(#token-blur)" opacity="0.85">
    <!-- Star tokens at the bottom of the pig's belly -->
    <use href="#star-shape" x="320" y="520" fill="url(#token-coral)" transform="rotate(15 320 520) scale(0.9)" />
    <use href="#star-shape" x="370" y="540" fill="url(#token-blue)" transform="rotate(-35 370 540) scale(0.95)" />
    <use href="#star-shape" x="430" y="530" fill="url(#token-green)" transform="rotate(45 430 530) scale(0.85)" />
    <use href="#star-shape" x="480" y="500" fill="url(#token-purple)" transform="rotate(-12 480 500) scale(0.9)" />
    <use href="#star-shape" x="270" y="490" fill="url(#token-orange)" transform="rotate(28 270 490) scale(0.88)" />
    <use href="#star-shape" x="330" y="460" fill="url(#token-purple)" transform="rotate(-52 330 460) scale(0.92)" />
    <use href="#star-shape" x="390" y="480" fill="url(#token-coral)" transform="rotate(63 390 480) scale(0.86)" />
    <use href="#star-shape" x="450" y="450" fill="url(#token-orange)" transform="rotate(18 450 450) scale(0.9)" />
    <use href="#star-shape" x="300" y="410" fill="url(#token-green)" transform="rotate(-25 300 410) scale(0.85)" />
    <use href="#star-shape" x="360" y="400" fill="url(#token-blue)" transform="rotate(40 360 400) scale(0.88)" />
    <use href="#star-shape" x="420" y="390" fill="url(#token-purple)" transform="rotate(-15 420 390) scale(0.95)" />
    <use href="#star-shape" x="470" y="420" fill="url(#token-coral)" transform="rotate(75 470 420) scale(0.8)" />
    
    <!-- Higher/floated tokens -->
    <use href="#star-shape" x="340" y="340" fill="url(#token-orange)" transform="rotate(-8 340 340) scale(0.85)" />
    <use href="#star-shape" x="410" y="330" fill="url(#token-blue)" transform="rotate(52 410 330) scale(0.8)" />
  </g>

  <!-- PIGGY BANK MAIN BODY (Translucent Frosted Iridescent Glass Outer Shell) -->
  <g>
    <!-- Back ear (three-quarter view) -->
    <path d="M 320,290 C 310,230 250,210 240,240 C 230,270 270,330 300,340 Z" fill="url(#iridescent-resin)" stroke="#ffffff" stroke-opacity="0.25" stroke-width="1.5" />
    <path d="M 315,295 C 308,245 265,230 255,250 C 248,270 278,315 295,325 Z" fill="#fae8ff" opacity="0.3" filter="url(#rim-blur)" />

    <!-- Back feet -->
    <rect x="250" y="580" width="70" height="90" rx="35" fill="url(#iridescent-resin)" transform="rotate(10 285 625)" stroke="#ffffff" stroke-opacity="0.2" stroke-width="1.5" />
    <rect x="440" y="580" width="70" height="90" rx="35" fill="url(#iridescent-resin)" transform="rotate(-8 475 625)" stroke="#ffffff" stroke-opacity="0.2" stroke-width="1.5" />

    <!-- Front feet (chubby cylinder legs) -->
    <rect x="290" y="590" width="75" height="100" rx="37.5" fill="url(#iridescent-resin)" stroke="#ffffff" stroke-opacity="0.3" stroke-width="2" />
    <rect x="400" y="590" width="75" height="100" rx="37.5" fill="url(#iridescent-resin)" stroke="#ffffff" stroke-opacity="0.3" stroke-width="2" />
    
    <!-- Tail (cute swirl at the back left) -->
    <path d="M 220,440 Q 180,430 170,460 T 190,490 T 205,470" fill="none" stroke="url(#iridescent-resin)" stroke-width="18" stroke-linecap="round" />
    <path d="M 220,440 Q 180,430 170,460 T 190,490 T 205,470" fill="none" stroke="#ffffff" stroke-opacity="0.4" stroke-width="6" stroke-linecap="round" filter="url(#rim-blur)" />

    <!-- Main Chubby Body (Slightly tilted egg shape for three-quarter view) -->
    <ellipse cx="380" cy="450" rx="200" ry="170" fill="url(#iridescent-resin)" stroke="#ffffff" stroke-opacity="0.35" stroke-width="2.5" />

    <!-- Front ear -->
    <path d="M 420,290 C 440,225 505,210 515,245 C 525,280 480,335 445,340 Z" fill="url(#iridescent-resin)" stroke="#ffffff" stroke-opacity="0.4" stroke-width="2" />
    <path d="M 425,295 C 438,240 488,230 495,255 C 502,280 465,325 440,328 Z" fill="#fae8ff" opacity="0.35" filter="url(#rim-blur)" />

    <!-- Specular rim highlight - Left side (blue studio light) -->
    <path d="M 183,430 C 183,320 270,283 380,283" fill="none" stroke="url(#rim-light-blue)" stroke-width="8" stroke-linecap="round" filter="url(#rim-blur)" />

    <!-- Specular rim highlight - Right side (warm studio light) -->
    <path d="M 380,283 C 490,283 577,320 577,430 C 577,540 490,617 380,617" fill="none" stroke="url(#rim-light)" stroke-width="10" stroke-linecap="round" filter="url(#rim-blur)" />

    <!-- Highlights on top of the head/back (frosted glow) -->
    <ellipse cx="370" cy="295" rx="110" ry="12" fill="url(#specular-top)" transform="rotate(-5 370 295)" />
    <ellipse cx="260" cy="370" rx="40" ry="8" fill="url(#specular-top)" transform="rotate(-40 260 370)" />
  </g>

  <!-- THE FACE (Sitting three-quarter view, looking slightly right) -->
  <g>
    <!-- Closed Happy Eyes (cute minimalist curved arcs) -->
    <!-- Left Eye -->
    <path d="M 415,385 Q 430,395 445,385" fill="none" stroke="#475569" stroke-width="5" stroke-linecap="round" />
    <path d="M 415,385 Q 430,395 445,385" fill="none" stroke="#ffffff" stroke-opacity="0.5" stroke-width="1.5" stroke-linecap="round" transform="translate(0, -1)" />
    
    <!-- Right Eye -->
    <path d="M 495,380 Q 510,390 525,380" fill="none" stroke="#475569" stroke-width="5" stroke-linecap="round" />
    <path d="M 495,380 Q 510,390 525,380" fill="none" stroke="#ffffff" stroke-opacity="0.5" stroke-width="1.5" stroke-linecap="round" transform="translate(0, -1)" />

    <!-- Soft Pink Blush Cheeks (under eyes, glowing) -->
    <ellipse cx="420" cy="415" rx="22" ry="14" fill="#fda4af" opacity="0.65" filter="url(#soft-glow)" />
    <ellipse cx="515" cy="410" rx="22" ry="14" fill="#fda4af" opacity="0.65" filter="url(#soft-glow)" />

    <!-- Small Round Snout (slightly rotated to support 3/4 view) -->
    <g transform="translate(470, 415) rotate(5)">
      <!-- Snout Base -->
      <ellipse cx="0" cy="0" rx="35" ry="26" fill="#fbcfe8" stroke="#ffffff" stroke-opacity="0.5" stroke-width="1.5" />
      <ellipse cx="0" cy="0" rx="30" ry="22" fill="#f472b6" opacity="0.15" filter="url(#rim-blur)" />
      
      <!-- Nostrils -->
      <circle cx="-10" cy="-2" r="5" fill="#475569" />
      <circle cx="10" cy="-2" r="5" fill="#475569" />
      
      <!-- Highlight on snout -->
      <ellipse cx="0" cy="-12" rx="16" ry="4" fill="#ffffff" opacity="0.6" />
    </g>
  </g>

  <!-- GLASS REFRACTION & OVERALL HIGHLIGHTS (Front-most layer) -->
  <g pointer-events="none">
    <!-- Big soft diagonal reflection across the entire body -->
    <path d="M 220,380 Q 350,330 480,480 Q 320,530 220,380 Z" fill="#ffffff" opacity="0.06" filter="url(#soft-glow)" />
    
    <!-- Pinpoint glints -->
    <circle cx="310" cy="330" r="12" fill="#ffffff" opacity="0.35" filter="url(#rim-blur)" />
    <circle cx="308" cy="328" r="5" fill="#ffffff" opacity="0.7" />
    <circle cx="495" cy="345" r="10" fill="#ffffff" opacity="0.3" filter="url(#rim-blur)" />
    <circle cx="493" cy="343" r="4" fill="#ffffff" opacity="0.6" />
  </g>
</svg>
